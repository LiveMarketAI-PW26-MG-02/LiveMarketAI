# Uncertainty Estimation Engine Configuration

engine:
  mc_samples: 100
  confidence_level: 0.1
  cache_enabled: true
  cache_ttl_seconds: 3600

models:
  gp:
    kernel: rbf
    length_scale: 1.0
    noise: 1e-3
  bnn:
    hidden_dims: [128, 64, 32]
    n_samples: 50
    dropout_rate: 0.1
  ensemble:
    n_estimators: 10

calibration:
  method: temperature_scaling
  n_bins: 15

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  file: logs/uncertainty_engine.log
