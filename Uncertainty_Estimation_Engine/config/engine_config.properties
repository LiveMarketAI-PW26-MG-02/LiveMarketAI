# Uncertainty Estimation Engine — Java Engine Configuration
# ==========================================================

# Bayesian
prior=NORMAL
prior_scale=1.0
burn_in=1000
proposal_std=0.1
noise_variance=0.001

# Monte Carlo
monte_carlo.n_samples=10000
monte_carlo.strategy=ANTITHETIC

# Ensemble
aggregation=TRIMMED_MEAN
trim_fraction=0.1
n_ensemble_members=5

# Confidence
confidence_level=0.95

# Logging
log_level=INFO
