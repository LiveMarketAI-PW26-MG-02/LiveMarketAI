version: "3.9"

# Liquidity Blackout Storm Defense — Docker Compose
# No JSON is used in any service configuration or runtime.

services:

  aggregator:
    build:
      context: ./federated-aggregator
      dockerfile: Dockerfile
    container_name: fpls_aggregator
    ports:
      - "50051:50051"
    networks:
      - fpls_net
    restart: unless-stopped

  python-node:
    build:
      context: ./python-node
      dockerfile: Dockerfile
    container_name: fpls_python
    environment:
      - GRPC_HOST=aggregator:50051
      - ZMQ_ENDPOINT=tcp://python-node:5570
    depends_on:
      - aggregator
    networks:
      - fpls_net
    ports:
      - "5570:5570"
      - "8815:8815"
    restart: unless-stopped

  r-node:
    build:
      context: ./r-node
      dockerfile: Dockerfile
    container_name: fpls_r
    environment:
      - ZMQ_SUB_ENDPOINT=tcp://python-node:5570
    depends_on:
      - python-node
    networks:
      - fpls_net
    restart: unless-stopped

  cpp-node:
    build:
      context: ./cpp-node
      dockerfile: Dockerfile
    container_name: fpls_cpp
    command: ["fpls_node", "aggregator:50051"]
    environment:
      - ZMQ_ENDPOINT=tcp://python-node:5570
    depends_on:
      - aggregator
      - python-node
    networks:
      - fpls_net
    restart: unless-stopped

  java-node:
    build:
      context: ./java-node
      dockerfile: Dockerfile
    container_name: fpls_java
    command: ["java", "-jar",
              "target/fpls-java-node-1.0.0-SNAPSHOT.jar",
              "java-monitor-01", "tcp://python-node:5570", "20"]
    depends_on:
      - python-node
    networks:
      - fpls_net
    restart: unless-stopped

networks:
  fpls_net:
    driver: bridge
