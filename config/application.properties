# Spring Boot application properties
server.port=8080
spring.application.name=inflation-indicators

# Inflation config
inflation.python-api-url=http://localhost:8000
inflation.forecast-horizon=12
inflation.fed-target=2.0
inflation.cache-enabled=true
inflation.cache-ttl-seconds=3600
inflation.default-model=ARIMA

# Logging
logging.level.root=INFO
logging.level.com.inflation=DEBUG
logging.file.name=logs/inflation-indicators.log
