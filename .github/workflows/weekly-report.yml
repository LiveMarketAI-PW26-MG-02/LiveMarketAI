name: PW26_MG_02_AUTOUPDATES_WEEKLY

on:
  schedule:
    - cron: '15 14 * * 0'  # Every Sunday at 7:45 PM IST (14:15 UTC)

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate report and send email
        shell: python3 {0}
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          REPO_NAME: ${{ github.repository }}
        run: |
          import smtplib
          import subprocess
          import os
          from collections import Counter
          from email.mime.text import MIMEText
          from datetime import datetime, timezone, timedelta

          SENDER_EMAIL = "mailtoadishreegupta@gmail.com"

          # ── Ordinal suffix helper ──────────────────────────────────────────
          def ordinal(n):
              if 11 <= (n % 100) <= 13:
                  suffix = "th"
              else:
                  suffix = {1: "st", 2: "nd", 3: "rd"}.get(n % 10, "th")
              return f"{n}{suffix}"

          def fmt_date(dt):
              return f"{ordinal(dt.day)} {dt.strftime('%B %Y')}"

          # ── Git helper ─────────────────────────────────────────────────────
          def git(cmd):
              return subprocess.run(
                  cmd, shell=True, capture_output=True, text=True
              ).stdout.strip()

          # ── Date range ─────────────────────────────────────────────────────
          now        = datetime.now(timezone.utc)
          since      = now - timedelta(days=7)
          since_iso  = since.strftime("%Y-%m-%dT%H:%M:%SZ")
          date_from  = fmt_date(since)
          date_to    = fmt_date(now)
          week_label = f"{date_from} to {date_to}"
          report_date = fmt_date(now)
          repo_name  = os.environ["REPO_NAME"]

          # ── Raw commits in last 7 days ─────────────────────────────────────
          raw     = git(f'git log --after="{since_iso}" --format="%an|%s"')
          commits = [line for line in raw.splitlines() if line.strip()]

          # ── All-time authors ───────────────────────────────────────────────
          all_authors = sorted(set(
              a for a in git('git log --format="%an"').splitlines() if a.strip()
          ))

          DIVIDER = "=" * 52
          SECTION = "-" * 36

          # ── Edge case: no commits ──────────────────────────────────────────
          if not commits:
              body = "\n".join([
                  "Respected Ma'am,",
                  "",
                  "Thank you for your guidance and support this week. As per your suggestions, please find the automated weekly progress report below:",
                  "",
                  DIVIDER,
                  "  WEEKLY GITHUB CONTRIBUTION REPORT",
                  f"  Sent by    : {SENDER_EMAIL}",
                  f"  Repository : {repo_name}",
                  f"  Report for : {date_from} to {date_to}",
                  f"  Generated  : {report_date}",
                  DIVIDER,
                  "",
                  f"No commits were made from {date_from} to {date_to}.",
                  "",
                  DIVIDER,
                  "This is an automated report generated by GitHub Actions.",
                  "Workflow : PW26_MG_02_AUTOUPDATES_WEEKLY",
              ])
              subject = (
                  f"[PW26_MG_02] Weekly Report | {week_label}"
                  f" | 0 Commits | ALL MEMBERS INACTIVE"
              )

          else:
              # ── Summary ───────────────────────────────────────────────────
              total_commits  = len(commits)
              active_authors = sorted(set(
                  c.split("|")[0] for c in commits if c.strip()
              ))
              active_count = len(active_authors)

              # ── Ranking ───────────────────────────────────────────────────
              counts        = Counter(c.split("|")[0] for c in commits if c.strip())
              ranking_lines = "\n".join(
                  f"  {author} -> {n} commit(s)"
                  for author, n in counts.most_common()
              )

              # ── Inactive members ──────────────────────────────────────────
              inactive_authors = [a for a in all_authors if a not in active_authors]
              inactive_count   = len(inactive_authors)

              if inactive_authors:
                  inactive_lines = "\n".join(f"  - {a}" for a in inactive_authors)
                  inactive_names = ", ".join(inactive_authors)
              else:
                  inactive_lines = "  All contributors were active this week."
                  inactive_names = "None"

              # ── Recent commits (last 10) ──────────────────────────────────
              recent_lines = "\n".join(
                  f"  {c.split('|')[0]}: {c.split('|', 1)[1]}"
                  for c in commits[:10]
              )

              # ── Assemble body ─────────────────────────────────────────────
              body = "\n".join([
                  "Respected Ma'am,",
                  "",
                  "Thank you for your guidance and support this week. As per your suggestions, please find the automated weekly progress report below:",
                  "",
                  DIVIDER,
                  "  WEEKLY GITHUB CONTRIBUTION REPORT",
                  f"  Sent by    : {SENDER_EMAIL}",
                  f"  Repository : {repo_name}",
                  f"  Report for : {date_from} to {date_to}",
                  f"  Generated  : {report_date}",
                  DIVIDER,
                  "",
                  SECTION,
                  "[A] SUMMARY",
                  SECTION,
                  f"  Report covers               : {date_from} to {date_to}",
                  f"  Total commits (last 7 days) : {total_commits}",
                  f"  Active contributors         : {active_count}",
                  f"  Inactive contributors       : {inactive_count}",
                  "",
                  SECTION,
                  "[B] CONTRIBUTION RANKING",
                  SECTION,
                  ranking_lines,
                  "",
                  SECTION,
                  "[C] INACTIVE MEMBERS (0 commits this week)",
                  SECTION,
                  inactive_lines,
                  "",
                  SECTION,
                  "[D] RECENT COMMITS (last 10)",
                  SECTION,
                  recent_lines,
                  "",
                  DIVIDER,
                  "This is an automated report generated by GitHub Actions.",
                  "Workflow : PW26_MG_02_AUTOUPDATES_WEEKLY",
              ])

              # ── Subject ───────────────────────────────────────────────────
              if inactive_names == "None":
                  subject = (
                      f"[PW26_MG_02] Weekly Report | {week_label}"
                      f" | {total_commits} Commits | All {active_count} Members Active"
                  )
              else:
                  subject = (
                      f"[PW26_MG_02] Weekly Report | {week_label}"
                      f" | {total_commits} Commits | Inactive: {inactive_names}"
                  )

          # ── Send email ─────────────────────────────────────────────────────
          username   = os.environ["EMAIL_USERNAME"]
          password   = os.environ["EMAIL_PASSWORD"]
          recipients = [
              "mahitha.g@pes.edu",
              "mahitharesearch@gmail.com",
              "mailtoadishreegupta@gmail.com",
          ]

          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = subject
          msg["From"]    = f"PW26_MG_02_AUTOUPDATES_WEEKLY <{SENDER_EMAIL}>"
          msg["To"]      = ", ".join(recipients)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(username, password)
              smtp.sendmail(SENDER_EMAIL, recipients, msg.as_string())

          print("Email sent successfully.")
          print(f"From    : {SENDER_EMAIL}")
          print(f"Subject : {subject}")
